<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="A cleaner, glassy skin for your Spotify — with glowing synced lyrics.">
<title>Lumen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="bg" aria-hidden="true"><canvas id="bg-canvas"></canvas><div class="bg-shade"></div><div class="bg-grain"></div></div>

<div id="app" class="hidden">
  <main id="views"></main>

  <div id="mini" class="hidden" role="button" aria-label="Open player">
    <div class="mini-inner">
      <div class="mini-art-wrap"><img class="mini-art" alt=""></div>
      <div class="mini-text"><div class="mini-title"></div><div class="mini-artist"></div></div>
      <button class="mini-btn" data-act="toggle" aria-label="Play or pause"></button>
      <button class="mini-btn" data-act="next" aria-label="Next"></button>
    </div>
    <div class="mini-progress"><i></i></div>
  </div>

  <nav id="tabbar">
    <div class="side-brand"><img src="icons/icon-192.png" alt=""><span>Lumen</span></div>
    <button class="tab" data-tab="home"></button>
    <button class="tab" data-tab="search"></button>
    <button class="tab" data-tab="library"></button>
    <button class="tab" data-tab="stats"></button>
    <div class="side-pins"></div>
    <div class="side-install install-slot"></div>
  </nav>

  <!-- desktop player bar (wide screens only) -->
  <div id="dbar" class="hidden">
    <div class="db-left">
      <button class="db-now" data-act="open"><img class="db-art" alt=""><span class="db-text"><span class="db-title"></span><span class="db-artist"></span></span></button>
      <button class="icon-btn db-like" aria-label="Like"></button>
    </div>
    <div class="db-center">
      <div class="db-buttons">
        <button class="ctl small" data-act="shuffle" aria-label="Shuffle"></button>
        <button class="ctl" data-act="prev" aria-label="Previous"></button>
        <button class="ctl play" data-act="toggle" aria-label="Play or pause"></button>
        <button class="ctl" data-act="next" aria-label="Next"></button>
        <button class="ctl small" data-act="repeat" aria-label="Repeat"></button>
      </div>
      <div class="db-progress"><span class="db-pos">0:00</span><div class="np-bar db-bar"><div class="np-fill db-fill"></div></div><span class="db-dur">0:00</span></div>
    </div>
    <div class="db-right">
      <button class="icon-btn db-sleep" data-act="sleep" aria-label="Sleep timer"></button>
      <button class="icon-btn" data-act="lyrics" aria-label="Lyrics"></button>
      <button class="icon-btn" data-act="queue" aria-label="Queue"></button>
      <button class="np-device" data-act="devices" aria-label="Devices"></button>
      <div class="db-vol">
        <button class="icon-btn db-mute" aria-label="Mute"></button>
        <div class="db-vbar" title="Volume"><div class="np-bar"><div class="np-fill db-vfill"></div></div></div>
      </div>
    </div>
  </div>
</div>

<section id="np" data-mode="cover" aria-hidden="true">
  <header class="np-top">
    <button class="icon-btn" id="np-close" aria-label="Close"></button>
    <div class="np-context"><small>Playing from</small><b></b></div>
    <button class="np-sleep hidden" aria-label="Sleep timer"></button>
    <button class="icon-btn" id="np-more" aria-label="More"></button>
  </header>
  <div class="np-main">
    <div class="np-head">
      <div class="np-art-wrap"><img class="np-art" alt=""></div>
      <div class="np-meta">
        <div class="np-titles">
          <div class="np-title"><span></span></div>
          <button class="np-artist"></button>
        </div>
        <button class="icon-btn np-like" aria-label="Like"></button>
      </div>
    </div>
    <div class="np-panel">
      <div class="np-lyrics"></div>
    </div>
    <div class="np-controls">
      <div class="np-progress">
        <div class="np-bar"><div class="np-fill"></div></div>
        <div class="np-times"><span class="np-pos">0:00</span><span class="np-dur">0:00</span></div>
      </div>
      <div class="np-buttons">
        <button class="ctl small" data-act="shuffle" aria-label="Shuffle"></button>
        <button class="ctl" data-act="prev" aria-label="Previous"></button>
        <button class="ctl play" data-act="toggle" aria-label="Play or pause"></button>
        <button class="ctl" data-act="next" aria-label="Next"></button>
        <button class="ctl small" data-act="repeat" aria-label="Repeat"></button>
      </div>
      <div class="np-bottom">
        <button class="np-device" data-act="devices" aria-label="Devices"></button>
        <button class="ly-pill" data-act="lyrics" aria-label="Lyrics"></button>
        <button class="ctl small" data-act="queue" aria-label="Queue"></button>
      </div>
    </div>
  </div>
</section>

<section id="queue" aria-hidden="true">
  <header class="qp-top">
    <button class="icon-btn qp-back" aria-label="Back"></button>
    <h1 class="qp-title">Queue</h1>
    <span class="topbar-gap"></span>
  </header>
  <div class="qp-body"></div>
</section>

<div id="sheet-root"></div>
<div id="toast" role="status"></div>
<div id="setup" class="hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
